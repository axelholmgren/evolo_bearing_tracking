# Copy for each experiment.
# ros2 launch evolo_bearing_config holy.launch.py config:=/absolute/path/to/file.yaml
# Branch:
# Commit:
# Commented keys use node defaults; uncomment to override, never leave blank.
# Fully commented sections: also uncomment the node line and ros__parameters.

holy:
  ros__parameters:
    # false=external YOLO, true=start local simulation stack.
    yolo: true
    # Python 3.10 venv with cached weights in models/; ~ supported.
    yolo_venv: ~/code/ros2_ws/src/smarc2/perception/smarc_yolo/yolo_ros/.venv
    # true/false: selected-target ray.
    bearing_ray: true
    # true/false: rays for track_ids below.
    bearing_ray_ids: false
    # false=raw TF, true=start and use corrected TF.
    corrected_camera_tf: false
    # ""=auto; explicit frame overrides correction selection.
    # Frames: evolo/z1_camera_link, evolo/z1_camera_corrected_link,
    # evolo/z1_global_camera_link, evolo/z1_global_camera_corrected_link,
    # or a custom camera-link TF (x forward).
    camera_frame: ""
    # true/false: bearing vs truth error.
    bearing_error: false
    # true/false: fixed GPS marker.
    fixed_marker: false
    # true/false: smarcduino GPS marker.
    smarcduino_marker: false
    # true/false: WARAPS GPS marker.
    waraps_marker: false
    # true/false: preprocessing, clustering, box tracking.
    # Tuning stays in dependency launches.
    lidar_boxes: false
    # true/false: RViz.
    rviz: true
    # true/false: bag replay; playback end stops launch.
    rosbag: false
    # Selected-target ray topic; align bearing_error_node.bearing_topic.
    bearing_output_topic: /evolo/gimbal_camera/target_bearing_marker
    # ""=packaged default, otherwise an RViz file path.
    rviz_config: ""
    # Bag path (~ supported); required for rosbag=true.
    bag_path: ""
    # true/false: publish /clock during replay; pair with use_sim_time.
    clock: true
    # Positive speed multiplier: 0.5=half, 1.0=normal, 2.0=double.
    replay_rate: 1.0
    # Seconds from bag start (>=0).
    start_offset: 0.0
    # null=play to end; otherwise bag-relative seconds > start_offset.
    stop_time: null

/**:
  ros__parameters:
    # false=wall clock, true=/clock from Unity or bag replay.
    use_sim_time: true
    # Horizontal FOV in degrees for yolo_action_server_node and bearing_ray_ids_node.
    # Set only here: a later node section would override /**.
    # camera_aperture: 57.1

corrected_camera_tf_node:
  ros__parameters:
    # Gimbal base TF frame.
    # base_frame: evolo/z1_base_link
    # Gimbal yaw TF frame.
    # yaw_frame: evolo/z1_yaw_link
    # Raw camera TF: evolo/z1_camera_link or evolo/z1_global_camera_link.
    # camera_frame: evolo/z1_camera_link
    # Corrected output TF; custom frames also need holy.camera_frame.
    # corrected_camera_frame: evolo/z1_camera_corrected_link
    # false=trigger on yaw TF, true=on camera TF (global-camera bags).
    # camera_tf_driven: false
    # absolute=curve + offsets, shape=curve only.
    # yaw_correction_mode: absolute
    # false=normal sign, true=opposite sign.
    negate_yaw_correction: true
    # false=calibrated range only, true=hold endpoint.
    # extend_yaw_correction: false

# Camera frame is selected by Holy.
bearing_ray_node:
  ros__parameters:
    # false=current ray, true=all rays (unbounded RViz history).
    keep_ray_history: true
    # TF wait in seconds (>=0); 0=no wait.
    # tf_timeout: 0.15

# Camera frame is selected by Holy.
# bearing_ray_ids_node:
  # ros__parameters:
    # Integer tracking IDs, e.g. [44] or [44, 68, 99]; replace per run.
    # track_ids:
      # - 44
      # - 68
      # - 99

# Correction settings below are metadata; match correction-node settings.
bearing_error_node:
  ros__parameters:
    # Target-bearing Marker topic; selected IDs: /evolo/gimbal_camera/selected_bearing_marker.
    # bearing_topic: /evolo/gimbal_camera/target_bearing_marker
    # ""=all tracks, otherwise string ID, e.g. "44".
    # bearing_track_id: ""
    # marker=truth_topic, lidar_box=lidar_boxes_topic.
    # truth_source: marker
    # /fixed_position_marker, /smarcduino/position_marker,
    # /smarcduino/waraps/position_marker, or another truth Marker topic.
    # Must match bearing frame; smarcduino markers use evolo/map.
    # truth_topic: /fixed_position_marker
    # Bounding-box MarkerArray topic (truth_source=lidar_box).
    # lidar_boxes_topic: /bounding_boxes/corrected
    # Integer Marker.id of the truth box.
    # lidar_box_id: 0
    # absolute=curve + offsets, shape=curve only.
    yaw_correction_mode: shape
    # false=normal sign, true=opposite sign.
    negate_yaw_correction: true
    # false=calibrated range only, true=hold endpoint.
    # extend_yaw_correction: false
    # Gcudata topic for correction metadata.
    # gimbal_gcu_feedback_topic: /evolo/gimbal_camera/gimbal_gcu_fb
    # Run label for automatic CSV filename; ""=no label.
    # bag: ""
    # false=no CSV, true=write CSV.
    save_csv: false
    # ""=automatic filename, otherwise CSV path (~ supported).
    # Use a fresh path; existing files can be overwritten.
    # output_file: ""
    # ""=disabled, otherwise Float64MultiArray output topic.
    # error_topic: ""

fixed_position_marker_node:
  ros__parameters:
    # Degrees [-90, 90]; replace example with target position.
    # latitude: 59.2985134
    # Degrees [-180, 180].
    # longitude: 18.2146923
    # Meters.
    # altitude: 0.0
    # Fixed Marker output topic.
    # marker_topic: /fixed_position_marker
    # Reachable TF frame; evolo/odom matches bearing rays.
    world_frame: evolo/odom

# No custom parameters; topics/frame are fixed.
smarcduino_position_marker_node:
  ros__parameters: {}

# No custom parameters; topics/frame are fixed.
smarcduino_waraps_position_marker_node:
  ros__parameters: {}

# YOLO sections apply only when holy.yolo=true.
# Commented keys follow smarc2 evolo_bringup.sh, then yolo_bringup/yolo.launch.py.
# Image input: /evolo/sensors/gimbal_camera/camera/image_raw (fixed).
# Requires models/yoloe-26s-seg.pt and mobileclip2_b.ts even with model overrides.
/yolo/yolo_node:
  ros__parameters:
    # YOLO, World, YOLOE; action server requires World/YOLOE.
    # model_type: YOLOE
    # Weights path; relative to venv/models/.
    # model: yoloe-26s-seg.pt
    # cpu or CUDA device, e.g. cuda:0.
    # device: cuda:0
    # false=skip images, true=run inference.
    # enable: true
    # true/false: model fusion; unsupported for YOLOE.
    # fuse_model: false
    # cv_bridge encoding, e.g. bgr8 or rgb8.
    # yolo_encoding: bgr8
    # 0=system default, 1=reliable, 2=best effort.
    # image_reliability: 2
    # Confidence threshold [0.0, 1.0].
    threshold: 0.1
    # NMS IoU threshold [0.0, 1.0].
    # iou: 0.7
    # Positive inference height in pixels.
    # imgsz_height: 480
    # Positive inference width in pixels.
    # imgsz_width: 640
    # false=full precision, true=FP16 (device/model support required).
    # half: false
    # Positive maximum detections per image.
    # max_det: 300
    # true/false: augmented inference (model support required).
    # augment: false
    # false=class-aware NMS, true=across classes.
    # agnostic_nms: false
    # false=inference-size masks, true=original-image-size masks.
    # retina_masks: false

# /yolo/tracking_node:
  # ros__parameters:
    # botsort.yaml, bytetrack.yaml, or custom YAML for either tracker.
    # tracker: botsort.yaml
    # 0=system default, 1=reliable, 2=best effort.
    # image_reliability: 2

# /yolo/debug_node:
  # ros__parameters:
    # 0=system default, 1=reliable, 2=best effort.
    # image_reliability: 2

/evolo/yolo_action_server_node:
  ros__parameters:
    # Prompt list, e.g. ["person", "boat", "buoy"]; [""]=no request.
    startup_classes: ["floating object", "buoy","boat"]
    # DetectionArray input topic.
    # yolo_tracking_topic: /yolo/tracking
    # QuaternionStamped output; bearing_ray_node expects this default.
    # image_poi_output: /evolo/gimbal_camera/tracked_poi_image
    # Selected-target DetectionArray output.
    # target_output: /yolo/target
    # Seconds before releasing a missing automatic target (>=0).
    # lock_timeout: 3.0
    # camera_aperture: set under /** (shared with bearing_ray_ids_node).
    # Camera-link frame ID in POI messages.
    # camera_frame_id: evolo/z1_camera_link
    # SetClasses service; "serivce" is the upstream spelling.
    # set_classes_serivce: /yolo/set_classes
    # SetParameters service; "serivce" is the upstream spelling.
    # set_parameter_serivce: /yolo/yolo_node/set_parameters
