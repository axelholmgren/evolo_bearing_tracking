# python3 evolo_bearing_config/scripts/send_evolo_path.py <this file> --ros-args -p use_sim_time:=true
#
# All positions in metres: x = east, y = north, origin = evolo's start
# (Unity world origin in AskoBearingSetups; evolo starts there facing north).
#
# Boats use the same metres, typed on each boat's WaypointNPCController in Unity:
#   Boat1: start [30, 150] m, startHeading 270 deg, no waypoints (stationary)

evolo:
  # m/s, or a preset: slow = 4.63 m/s, standard = 4.9 m/s, fast = 6.0 m/s
  # (evolo_move_path evolo_params.yaml; control.py clamps to 6 m/s).
  speed: standard
  # m; waypoint counts as reached inside this radius.
  tolerance: 10.0
  # [east, north] m from evolo's start, visited in order.
  waypoints:
    # - [0, 100]
    - [0, 300]
