# Copy this file for each experiment.
#
# Example:
#
# cp template.yaml timing_test.yaml
#
# ros2 launch evolo_bearing_config holy.launch.py \
#   config:=/absolute/path/to/timing_test.yaml


# ================================================================
# WHAT TO LAUNCH
# ================================================================

holy:
  ros__parameters:

    # Bearing
    bearing_ray: true
    bearing_ray_ids: false
    # false = raw camera TF; true = corrected camera TF
    corrected_camera_tf: true
    camera_frame: evolo/z1_global_camera_corrected_link

    # Error calculation / logging
    bearing_error: false

    # Reference markers
    fixed_marker: true
    smarcduino_marker: false
    waraps_marker: false

    # LiDAR preprocessing + clustering + bbox tracking
    lidar_boxes: false

    # Visualization
    rviz: true

    # Rosbag replay
    rosbag: false


    # ------------------------------------------------------------
    # Launch settings
    # ------------------------------------------------------------

    bearing_output_topic: /evolo/gimbal_camera/target_bearing_marker

    # Empty = packaged default.
    rviz_config: ""

    # Required when rosbag: true.
    bag_path: "~/ros_logs/AXL/CAM/rosbag2_2026_08_17-15_02_44/"

    replay_rate: 3.0
    start_offset: 0.0
    # Absolute bag time in seconds; null plays to the end.
    stop_time: null


# ================================================================
# COMMON ROS PARAMETERS
# ================================================================

/**:
  ros__parameters:

    # false for live operation
    # true for rosbag playback with --clock
    use_sim_time: true


# ================================================================
# CALIBRATED CAMERA TF
# ================================================================

corrected_camera_tf_node:
  ros__parameters:
    camera_frame: evolo/z1_global_camera_link
    corrected_camera_frame: evolo/z1_global_camera_corrected_link
    camera_tf_driven: true
    # absolute (current) or shape (curve only)
    yaw_correction_mode: absolute
    negate_yaw_correction: true
    # false = no correction outside the LUT; true = hold nearest endpoint.
    extend_yaw_correction: true


# ================================================================
# BEARING RAY
# ================================================================

bearing_ray_node:
  ros__parameters:
    keep_ray_history: true


# ================================================================
# SELECTED TRACK-ID BEARING RAYS
# ================================================================

bearing_ray_ids_node:
  ros__parameters:

    track_ids:
      - 44
      - 68
      - 99



# ================================================================
# BEARING ERROR
# ================================================================

bearing_error_node:
  ros__parameters:

    bearing_topic: /evolo/gimbal_camera/target_bearing_marker

    # Empty = no selected-track filtering.
    bearing_track_id: ""

    # marker or lidar_box
    truth_source: marker


    # ------------------------------------------------------------
    # Marker truth
    # ------------------------------------------------------------

    truth_topic: /fixed_position_marker


    # ------------------------------------------------------------
    # LiDAR truth
    # ------------------------------------------------------------

    lidar_boxes_topic: /bounding_boxes/corrected
    lidar_box_id: 0


    # ------------------------------------------------------------
    # Correction metadata
    # ------------------------------------------------------------

    yaw_correction_mode: absolute
    negate_yaw_correction: true
    extend_yaw_correction: true

    gimbal_gcu_feedback_topic: /evolo/gimbal_camera/gimbal_gcu_fb


    # ------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------

    # Used in automatic output filename generation.
    bag: ""

    save_csv: true

    # Empty = automatic output filename.
    output_file: "~/code/ros2_ws/src/evolo_bearing_tracking/results/fixed_object_extended_curve_user_offset.csv"

    # Empty = do not publish a live error topic.
    error_topic: ""


# ================================================================
# FIXED POSITION MARKER
# ================================================================

fixed_position_marker_node:
  ros__parameters:

    latitude: 59.2985134
    longitude: 18.2146923
    altitude: 0.0

    marker_topic: /fixed_position_marker
    world_frame: evolo/odom


# ================================================================
# MARKERS WITHOUT EXTRA PARAMETERS
# ================================================================

smarcduino_position_marker_node:
  ros__parameters: {}

smarcduino_waraps_position_marker_node:
  ros__parameters: {}
