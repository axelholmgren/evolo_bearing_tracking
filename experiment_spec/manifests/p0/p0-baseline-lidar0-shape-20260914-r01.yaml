  replay: ros2 bag play <bag-path> --clock --rate 1.0
  analysis: >-
    python3 analysis/plot_scripts/compare_yaw_correction.py <raw-csv> <corrected-csv> --match-tolerance 0.08 --max-abs-error 80 --label p0-baseline-lidar0-shape-20260914-r01 --paired-output-dir results/p0-baseline-lidar0-shape-20260914-r01 --output-dir results/p0-baseline-lidar0-shape-20260914-r01/plots
